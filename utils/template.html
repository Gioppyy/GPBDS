<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — GPBDS Report</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --muted:   #8b949e;
    --text:    #e6edf3;
    --mono:    'Consolas', 'SFMono-Regular', monospace;

    --c-critical: #f85149;
    --c-high:     #f0883e;
    --c-medium:   #d29922;
    --c-low:      #3fb950;
    --c-info:     #58a6ff;

    --bg-critical: rgba(248, 81, 73,  0.08);
    --bg-high:     rgba(240, 136, 62, 0.08);
    --bg-medium:   rgba(210, 153, 34, 0.08);
    --bg-low:      rgba(63, 185, 80,  0.08);
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    padding: 16px;
}

/* ── top bar ── */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 14px;
    gap: 12px;
    flex-wrap: wrap;
}
.topbar-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}
.topbar-title span { color: var(--muted); font-weight: 400; }
.topbar-meta { color: var(--muted); font-size: 11px; }

/* ── stat strip ── */
.stats {
    display: flex;
    gap: 1px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 14px;
    font-size: 11px;
}
.stat {
    flex: 1;
    padding: 8px 12px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.stat + .stat { border-left: 1px solid var(--border); }
.stat-label { color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; }
.stat-value { font-size: 18px; font-weight: 700; }
.stat-value.c-critical { color: var(--c-critical); }
.stat-value.c-high     { color: var(--c-high); }
.stat-value.c-medium   { color: var(--c-medium); }
.stat-value.c-low      { color: var(--c-low); }
.stat-value.c-text     { color: var(--text); }

/* ── filter bar ── */
.filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}
.filter-btn {
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
}
.filter-btn:hover, .filter-btn.active {
    color: var(--text);
    border-color: var(--c-info);
}
.filter-btn.active { background: rgba(88, 166, 255, .1); }
#search {
    flex: 1;
    min-width: 180px;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    outline: none;
}
#search:focus { border-color: var(--c-info); }
#search::placeholder { color: var(--muted); }

/* ── findings list ── */
.findings { display: flex; flex-direction: column; gap: 4px; }

.finding {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color .15s;
}
.finding:hover { border-color: #484f58; }
.finding.hidden { display: none; }

.finding-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    min-width: 0;
}
.finding-head:hover { background: #1c2128; }

.sev-tag {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: .4px;
    min-width: 62px;
    text-align: center;
}
.sev-tag.CRITICAL { background: var(--bg-critical); color: var(--c-critical); border: 1px solid var(--c-critical); }
.sev-tag.HIGH     { background: var(--bg-high);     color: var(--c-high);     border: 1px solid var(--c-high); }
.sev-tag.MEDIUM   { background: var(--bg-medium);   color: var(--c-medium);   border: 1px solid var(--c-medium); }
.sev-tag.LOW      { background: var(--bg-low);       color: var(--c-low);     border: 1px solid var(--c-low); }

.score-chip {
    flex-shrink: 0;
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    min-width: 38px;
    text-align: center;
}

.finding-path {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    direction: rtl;       /* truncate from left so filename stays visible */
    text-align: left;
}

.match-count {
    flex-shrink: 0;
    font-size: 10px;
    color: var(--muted);
}

.chevron {
    flex-shrink: 0;
    font-size: 10px;
    color: var(--muted);
    transition: transform .2s;
}
.finding.open .chevron { transform: rotate(90deg); }

/* ── finding body ── */
.finding-body { display: none; border-top: 1px solid var(--border); }
.finding.open .finding-body { display: block; }

.match {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 0 10px;
    align-items: start;
}
.match:last-child { border-bottom: none; }

.match-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
}
.match-dot.CRITICAL { background: var(--c-critical); }
.match-dot.HIGH     { background: var(--c-high); }
.match-dot.MEDIUM   { background: var(--c-medium); }
.match-dot.LOW      { background: var(--c-low); }

.match-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    grid-column: 1 / 3;
}
.match-check-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
}
.match-snippet {
    margin-top: 6px;
    grid-column: 1 / 4;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre;
    color: #adbac7;
    max-height: 120px;
}

.footer {
    margin-top: 20px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-title">🛡 GP Backdoor Scanner <span>/ {{TITLE}}</span></div>
    <div class="topbar-meta">{{DATE}} &nbsp;·&nbsp; v{{VERSION}}</div>
</div>

<div class="stats">
    <div class="stat">
        <span class="stat-label">Findings</span>
        <span class="stat-value c-text">{{TOTAL}}</span>
    </div>
    <div class="stat">
        <span class="stat-label">Files</span>
        <span class="stat-value c-text">{{FILE_COUNT}}</span>
    </div>
    <div class="stat">
        <span class="stat-label">Risk score</span>
        <span class="stat-value c-text">{{RISK_SCORE}}</span>
    </div>
    <div class="stat">
        <span class="stat-label">Critical</span>
        <span class="stat-value c-critical">{{CRITICAL_COUNT}}</span>
    </div>
    <div class="stat">
        <span class="stat-label">High</span>
        <span class="stat-value c-high">{{HIGH_COUNT}}</span>
    </div>
    <div class="stat">
        <span class="stat-label">Medium</span>
        <span class="stat-value c-medium">{{MEDIUM_COUNT}}</span>
    </div>
    <div class="stat">
        <span class="stat-label">Low</span>
        <span class="stat-value c-low">{{LOW_COUNT}}</span>
    </div>
</div>

<div class="filter-bar">
    <input id="search" type="text" placeholder="filter by path or check…">
    <button class="filter-btn active" data-sev="ALL">All</button>
    <button class="filter-btn" data-sev="CRITICAL">Critical</button>
    <button class="filter-btn" data-sev="HIGH">High</button>
    <button class="filter-btn" data-sev="MEDIUM">Medium</button>
    <button class="filter-btn" data-sev="LOW">Low</button>
</div>

<div class="findings" id="findings">
{{FINDINGS}}
</div>

<div class="footer">© 2026 GPBDS v{{VERSION}}</div>

<script>
const findings = document.querySelectorAll('.finding');

// toggle open/close
document.getElementById('findings').addEventListener('click', e => {
    const head = e.target.closest('.finding-head');
    if (!head) return;
    head.closest('.finding').classList.toggle('open');
});

// filter
let activeSev = 'ALL';
const search = document.getElementById('search');

function applyFilter() {
    const q = search.value.toLowerCase();
    findings.forEach(f => {
        const sevOk  = activeSev === 'ALL' || f.dataset.sev === activeSev;
        const textOk = !q || f.dataset.path.includes(q) || f.dataset.checks.includes(q);
        f.classList.toggle('hidden', !(sevOk && textOk));
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeSev = btn.dataset.sev;
        applyFilter();
    });
});

search.addEventListener('input', applyFilter);

// open all CRITICAL by default
findings.forEach(f => { if (f.dataset.sev === 'CRITICAL') f.classList.add('open'); });
</script>
</body>
</html>
